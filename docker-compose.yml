name: "php-ceti"

services:
  api:
    container_name: "php-api"
    hostname: "php-api"
    image: php:8.5.2-fpm-alpine
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    depends_on:
      - postgres
    networks:
      - api_network

  postgres:
    container_name: "postgres"
    hostname: "postgres"
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: crud_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret123
    ports:
      - "5460:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - api_network

  nginx:
    container_name: "nginx"
    hostname: "nginx"
    image: nginx:alpine
    ports:
      - "9000:80"
    volumes:
      - ./html:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
    networks:
      - api_network

